name: Deploy Demo → Vercel

on:
  push:
    branches: [demo]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel production deploy
        run: |
          curl -X POST \
            "https://api.vercel.com/v1/integrations/deploy/prj_b5QmNZ0U1lMroyv2nRmh8FPUWFRg/sNyTA0fQmb" \
            --fail
          echo "Deploy triggered"
